<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="B线：1阿勒泰向西到白哈巴，2坐景区车向东到喀纳斯，3原路向西返回白哈巴或铁热克提取车，4向东回阿勒泰">
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M1 1L14 8 1 15Z" fill="#b66337"/></marker><marker id="back" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M1 1L14 8 1 15Z" fill="#95452f"/></marker></defs>
<rect width="1000" height="620" rx="22" fill="#fbf2e8"/>
<path d="M90 250Q420 55 940 210M70 335Q360 160 930 320" fill="none" stroke="#f1e1d0" stroke-width="35" opacity=".6"/>
<text x="44" y="43" fill="#663b2c" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="700">B 线｜先白哈巴，再喀纳斯</text>
<text x="812" y="42" fill="#8c6b58" font-family="Microsoft YaHei,sans-serif" font-size="17">↑ 北　← 西 / 东 →</text>
<g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
 <path d="M790 485 C610 419 395 420 240 470 C147 402 136 275 171 191" stroke="#b66337" marker-end="url(#arr)"/>
 <path d="M200 157 Q305 70 428 155" stroke="#b66337" marker-end="url(#arr)"/>
 <path d="M429 189 Q315 268 201 202 C165 288 179 405 215 468" stroke="#95452f" stroke-dasharray="13 8" marker-end="url(#back)"/>
 <path d="M241 511 C434 580 670 568 795 516" stroke="#b66337" marker-end="url(#arr)"/>
</g>
<g font-family="Microsoft YaHei,sans-serif" font-weight="700">
 <g transform="translate(532 418)"><circle r="22" fill="#b66337"/><text y="8" text-anchor="middle" fill="white" font-size="22">1</text></g>
 <g transform="translate(314 101)"><circle r="22" fill="#b66337"/><text y="8" text-anchor="middle" fill="white" font-size="22">2</text></g>
 <g transform="translate(311 269)"><circle r="22" fill="#95452f"/><text y="8" text-anchor="middle" fill="white" font-size="22">3</text></g>
 <g transform="translate(548 547)"><circle r="22" fill="#b66337"/><text y="8" text-anchor="middle" fill="white" font-size="22">4</text></g>
</g>
<g font-family="Microsoft YaHei,sans-serif" fill="#49382e">
 <g transform="translate(810 501)"><circle r="12" fill="#fff" stroke="#b66337" stroke-width="4"/><text x="-28" y="44" font-size="19" font-weight="700">阿勒泰市</text><text x="-13" y="64" font-size="13">10/4、10/9 住</text></g>
 <g transform="translate(177 176)"><circle r="12" fill="#fff" stroke="#b66337" stroke-width="4"/><text x="-84" y="-55" font-size="19" font-weight="700">白哈巴</text><text x="-99" y="-36" font-size="13">10/5 住；边境村落</text></g>
 <g transform="translate(447 172)"><circle r="12" fill="#fff" stroke="#b66337" stroke-width="4"/><text x="18" y="-15" font-size="19" font-weight="700">喀纳斯</text><text x="18" y="4" font-size="13">湖 · 观鱼台 · 连住2晚</text></g>
 <g transform="translate(223 487)"><circle r="12" fill="#fff" stroke="#b66337" stroke-width="4"/><text x="-95" y="35" font-size="19" font-weight="700">铁热克提</text><text x="-95" y="55" font-size="13">10/8 住；可作停车点</text></g>
</g>
<g font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="700">
<text x="616" y="394" fill="#b66337">10/5 自驾向西</text><text x="257" y="68" fill="#b66337">10/6 景区车向东</text><text x="334" y="298" fill="#95452f">10/8 原路折返取车</text><text x="630" y="579" fill="#b66337">10/9 回城</text>
</g>
<text x="40" y="607" fill="#79695a" font-family="Microsoft YaHei,sans-serif" font-size="12">方位与转场示意，不按道路里程绘制；白哈巴车辆准入、停车及双向景区车尚待核实。</text>
</svg>
