<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="A线：1阿勒泰向北东到禾木，2经贾登峪向西北到喀纳斯，3回贾登峪向西南到铁热克提，4向东回阿勒泰">
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M1 1L14 8 1 15Z" fill="#176d58"/></marker></defs>
<rect width="1000" height="620" rx="22" fill="#edf4ec"/>
<path d="M90 250Q420 55 940 210M70 335Q360 160 930 320" fill="none" stroke="#d9e8da" stroke-width="35" opacity=".65"/>
<text x="44" y="43" fill="#26473c" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="700">A 线｜先禾木，再喀纳斯</text>
<text x="812" y="42" fill="#476d5c" font-family="Microsoft YaHei,sans-serif" font-size="17">↑ 北　← 西 / 东 →</text>
<g fill="none" stroke="#176d58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
 <path d="M827 486 C940 355 908 235 773 167" marker-end="url(#arr)"/>
 <path d="M725 170 C660 220 592 250 561 324 C492 314 451 250 444 183" marker-end="url(#arr)"/>
 <path d="M422 187 C413 271 464 334 535 353 C429 423 316 443 225 475" marker-end="url(#arr)"/>
 <path d="M232 508 C425 580 663 574 796 520" marker-end="url(#arr)"/>
</g>
<g font-family="Microsoft YaHei,sans-serif" font-weight="700">
 <g transform="translate(909 313)"><circle r="22" fill="#176d58"/><text y="8" text-anchor="middle" fill="white" font-size="22">1</text></g>
 <g transform="translate(614 209)"><circle r="22" fill="#176d58"/><text y="8" text-anchor="middle" fill="white" font-size="22">2</text></g>
 <g transform="translate(390 403)"><circle r="22" fill="#176d58"/><text y="8" text-anchor="middle" fill="white" font-size="22">3</text></g>
 <g transform="translate(540 552)"><circle r="22" fill="#176d58"/><text y="8" text-anchor="middle" fill="white" font-size="22">4</text></g>
</g>
<g font-family="Microsoft YaHei,sans-serif" fill="#213e34">
 <g transform="translate(809 503)"><circle r="12" fill="#fff" stroke="#176d58" stroke-width="4"/><text x="-28" y="45" font-size="19" font-weight="700">阿勒泰市</text><text x="-13" y="65" font-size="13">10/4、10/9 住</text></g>
 <g transform="translate(748 158)"><circle r="12" fill="#fff" stroke="#176d58" stroke-width="4"/><text x="-8" y="-30" font-size="19" font-weight="700">禾木</text><text x="-49" y="-11" font-size="13">禾木桥 · 白桦林</text></g>
 <g transform="translate(441 166)"><circle r="12" fill="#fff" stroke="#176d58" stroke-width="4"/><text x="-51" y="-32" font-size="19" font-weight="700">喀纳斯</text><text x="-80" y="-12" font-size="13">湖 · 观鱼台 · 连住2晚</text></g>
 <g transform="translate(551 337)"><circle r="10" fill="#fff" stroke="#769b87" stroke-width="3"/><text x="17" y="3" font-size="16" font-weight="700">贾登峪</text><text x="17" y="23" font-size="12">停车、换乘；三湾在出园方向</text></g>
 <g transform="translate(207 490)"><circle r="12" fill="#fff" stroke="#176d58" stroke-width="4"/><text x="-86" y="-54" font-size="19" font-weight="700">铁热克提</text><text x="-96" y="-35" font-size="13">10/8 住；铁贾通行待查</text></g>
</g>
<g font-family="Microsoft YaHei,sans-serif" fill="#176d58" font-size="14" font-weight="700">
<text x="710" y="428">10/5 自驾向北</text><text x="690" y="248">10/6 转景区车</text><text x="272" y="367">10/8 出园向西</text><text x="617" y="579">10/9 回城</text>
</g>
<text x="40" y="607" fill="#5a7367" font-family="Microsoft YaHei,sans-serif" font-size="12">方位与转场示意，不按道路里程绘制；10/8 需从喀纳斯经贾登峪出园取车，铁贾关闭则改开放道路。</text>
</svg>
